<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Usuario - Llamada 1 a 1</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    :root {
      --primary-color: #007aff;
      --accent-color: #5ac8fa;
      --bg-gradient: linear-gradient(135deg, #1c1c1e, #2c2c2e);
      --message-bg: rgba(255,255,255,0.3);
      --message-radius: 14px;
      --message-padding: 12px 16px;
      --message-font: 15px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    html, body {
      width: 100%;
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
      background: var(--bg-gradient) fixed no-repeat center/cover;
      color: #f2f2f7;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      line-height: 1.6;
    }

    /* ————— Rotador de frases estilo iOS ————— */
    #anxietyMessage {
      position: fixed;
      top: calc(20px + env(safe-area-inset-top));
      left: 50%;
      transform: translateX(-50%);
      max-width: 320px;
      width: 90%;
      background: var(--message-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: var(--message-radius);
      padding: var(--message-padding);
      font: var(--message-font);
      text-align: center;
      opacity: 0;
      transition: opacity 1s ease-in-out;
      z-index: 1000;
    }

    /* ————— Botón y audio (tu CSS existente adaptado) ————— */
    h2 {
      margin-bottom: 1.5rem;
      font-size: 1.5rem;
    }
    #startCall {
      display: block;
      margin: 0 auto;
      background: var(--primary-color);
      color: #fff;
      padding: 10px 20px;
      border: none;
      border-radius: 12px;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.2s;
    }
    #startCall:hover {
      background: var(--accent-color);
    }
    #status {
      margin-top: 0.75rem;
      font-weight: bold;
      color: #d1d1d6;
    }
    #remoteAudio {
      display: block;
      width: 160px;
      margin: 1rem auto 0 auto;
      transform: scale(0.85);
    }
  </style>
</head>
<body>

  <div id="anxietyMessage"></div>

  <h2>No estas solo estamos con vos</h2>
  <button id="startCall">Iniciar llamada</button>
  <p id="status">Esperando...</p>
  <audio id="remoteAudio" controls autoplay></audio>

  <script>
    (function() {
      const messages = [
        'Respira hondo… estás en un espacio seguro.',
        'Concéntrate en el ritmo de tu respiración.',
        'Permítete soltar lo que no puedes controlar.',
        'Esto pasará. Un momento a la vez.'
      ];
      const display = document.getElementById('anxietyMessage');
      let idx = 0;

      function showNext() {
        // Fade out
        display.style.opacity = '0';
        setTimeout(() => {
          // Cambiar texto y fade in
          display.textContent = messages[idx];
          display.style.opacity = '1';
          // Preparar siguiente índice
          idx = (idx + 1) % messages.length;
        }, 1000); // coincide con transition de 1s
      }

      // Mostrar primera frase inmediatamente
      display.textContent = messages[0];
      display.style.opacity = '1';
      idx = 1;

      // Cambiar cada 6 segundos (4s visible + 1s fade out + 1s fade in)
      setInterval(showNext, 6000);
    })();
  </script>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getDatabase, ref, push, set, onValue, onDisconnect } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-database.js";

    // Configuración Firebase
    const firebaseConfig = {
      apiKey: "AIzaSyA_USvfSXAqZf7hQhJCon0WulnrrINB7cI",
      authDomain: "the-pic-c437e.firebaseapp.com",
      databaseURL: "https://the-pic-c437e-default-rtdb.firebaseio.com",
      projectId: "the-pic-c437e",
      storageBucket: "the-pic-c437e.appspot.com",
      messagingSenderId: "750954597180",
      appId: "1:750954597180:web:d7b67c6b60f4d3bb17ec39"
    };
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    // Configuración ICE con STUN y TURN
    const iceConfig = {
      iceServers: [
        { urls: "stun:stun.l.google.com:19302" },
        {
          urls: "turn:numb.viagenie.ca:3478", // Servidor TURN público para pruebas
          username: "webrtc@live.com",
          credential: "password"
        }
      ]
    };

    let pc, localStream, callRef;
    const statusDisplay = document.getElementById('status');
    const remoteAudio = document.getElementById('remoteAudio');


    // Función para limpiar al final de la llamada
    function handleCallEnd(message) {
        console.log("Usuario: Llamada terminada. Limpiando...");
        statusDisplay.innerText = message;
        if (localStream) {
            localStream.getTracks().forEach(track => track.stop()); // Detener micrófono
            localStream = null;
        }
        if (pc) {
            pc.close(); // Cerrar conexión WebRTC
            pc = null;
        }
        remoteAudio.srcObject = null; // Detener audio remoto
        // Opcional: Actualizar UI para permitir iniciar otra llamada
        document.getElementById('startCall').disabled = false;
    }


    document.getElementById('startCall').onclick = async () => {
      document.getElementById('startCall').disabled = true; // Deshabilitar botón

      // Añadir manejo de errores para getUserMedia
      try {
        localStream = await navigator.mediaDevices.getUserMedia({ audio: true });
        statusDisplay.innerText = 'Micrófono obtenido...';
      } catch (error) {
        console.error("Usuario: Error al acceder al micrófono:", error);
        statusDisplay.innerText = 'Error: No se pudo acceder al micrófono.';
        document.getElementById('startCall').disabled = false; // Habilitar botón de nuevo
        return; // Salir si no se obtiene el micrófono
      }


      pc = new RTCPeerConnection(iceConfig);

      localStream.getTracks().forEach(track => pc.addTrack(track, localStream));

      pc.ontrack = event => {
        console.log('Usuario: Recibido remote track');
        remoteStream.addTrack(event.track);
        // Intentar reproducir, pero manejar posibles restricciones de autoplay en móviles
        remoteAudio.play().catch(() => {
           console.log("Usuario: Autoplay de audio remoto bloqueado o fallido.");
           statusDisplay.innerText = 'Audio remoto listo (puede requerir interacción para empezar)';
        });
      };

      // **LOGS ADICIONALES para ICE candidates**
      pc.onicecandidate = event => {
        if (event.candidate) {
           console.log('Usuario: Candidato ICE generado:', event.candidate.type, event.candidate.candidate); // Log del tipo y contenido parcial del candidato
           push(ref(db, `calls/${callRef.key}/callerCandidates`), event.candidate.toJSON())
             .then(() => console.log('Usuario: Candidato ICE enviado a Firebase'))
             .catch(e => console.error("Usuario: Error enviando ICE candidate a Firebase:", e));
        } else {
            console.log('Usuario: Fin de candidatos ICE (null candidate)');
        }
      };

      // **LOGS ADICIONALES para estado de ICE gathering**
      pc.onicegatheringstatechange = () => {
          console.log(`Usuario: ICE gathering state: ${pc.iceGatheringState}`);
          if (pc.iceGatheringState === 'complete') {
              console.log('Usuario: Recolección de candidatos ICE completa.');
          }
      };


      // Añadir listeners para el estado de la conexión
      pc.oniceconnectionstatechange = () => {
          console.log(`Usuario: ICE connection state: ${pc.iceConnectionState}`);
      };

       pc.onconnectionstatechange = () => {
          console.log(`Usuario: Connection state: ${pc.connectionState}`);
           if (pc.connectionState === 'connected') {
               statusDisplay.innerText = 'Conectado';
           } else if (['disconnected', 'failed', 'closed'].includes(pc.connectionState)) {
               handleCallEnd(`Llamada terminada (${pc.connectionState})`);
           } else {
               statusDisplay.innerText = `Estado: ${pc.connectionState}`;
           }
       };


      // Crear llamada en Firebase
      callRef = push(ref(db, 'calls'));
      console.log(`Usuario: Creando llamada con ID: ${callRef.key}`);
      await set(callRef, { status: 'waiting' })
        .then(() => console.log('Usuario: Estado de llamada "waiting" seteado en Firebase'))
        .catch(e => console.error("Usuario: Error seteando estado waiting en Firebase:", e));

      // Limpiar el llamado de Firebase si la página se cierra o recarga
      onDisconnect(callRef).remove()
         .then(() => console.log('Usuario: onDisconnect configurado para limpiar la llamada'))
         .catch(e => console.error("Usuario: Error configurando onDisconnect:", e));


      // Crear y enviar oferta
      try {
          const offer = await pc.createOffer();
          await pc.setLocalDescription(offer);
          console.log('Usuario: Oferta creada y seteada localmente.');
          await set(ref(db, `calls/${callRef.key}/offer`), offer);
           console.log('Usuario: Oferta enviada a Firebase.');
           statusDisplay.innerText = 'Esperando admin...';
      } catch (error) {
          console.error("Usuario: Error al crear/enviar la oferta:", error);
          handleCallEnd("Error al crear oferta"); // Considerar terminar la llamada si falla la oferta
          return;
      }


      // Recibir respuesta
      onValue(ref(db, `calls/${callRef.key}/answer`), async snap => {
        if (snap.exists() && !pc.currentRemoteDescription) {
          console.log('Usuario: Respuesta recibida de Firebase.');
          try {
             await pc.setRemoteDescription(new RTCSessionDescription(snap.val()));
             console.log('Usuario: Respuesta seteada remotamente.');
             // El estado "Conectado" ahora se actualiza en pc.onconnectionstatechange
          } catch (error) {
              console.error("Usuario: Error al setear la respuesta remota:", error);
              handleCallEnd("Error al procesar respuesta remota");
          }
        } else if (snap.exists() && pc.currentRemoteDescription) {
            console.log('Usuario: Respuesta recibida pero remoteDescription ya existe.');
        } else {
             console.log('Usuario: Respuesta no existe (aún).');
        }
      });

      // Recibir candidatos ICE del admin
      onValue(ref(db, `calls/${callRef.key}/adminCandidates`), snap => {
        console.log('Usuario: Nuevos candidatos ICE del admin en Firebase.');
        snap.forEach(child => {
            const candidate = new RTCIceCandidate(child.val());
            console.log('Usuario: Candidato ICE del admin recibido:', candidate.type, candidate.candidate); // Log del tipo y contenido
            pc.addIceCandidate(candidate)
              .then(() => console.log('Usuario: Candidato ICE del admin añadido con éxito.'))
              .catch(e => console.error("Usuario: Error añadiendo ICE candidate del admin:", e)); // Añadido catch para errores en addIceCandidate
        });
      });
    };
  </script>
</body>
</html>
